services:
  elyoraa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Deploy the registry image without building: set
    # ELYORAA_IMAGE=ghcr.io/<owner>/elyoraa:<sha> and run
    # `docker compose pull && docker compose up -d`. Rollback = point the
    # variable at the previous SHA tag.
    image: ${ELYORAA_IMAGE:-elyoraa}
    container_name: elyoraa
    # OOM kills arrive as SIGKILL — no drain runs. Without a restart policy
    # the container stays down and every pending comment hangs until a human
    # notices; restart it so killed work requeues and webhooks keep landing.
    restart: unless-stopped
    # Grace for SHUTDOWN_DRAIN_TIMEOUT plus HTTP shutdown — the default 10s
    # would SIGKILL mid-review. Keep >= the drain timeout you configure
    # (drain defaults to REVIEW_TIMEOUT, 30m).
    stop_grace_period: 35m
    ports:
      - "8080:8080"
    volumes:
      # Bind-mount the host repo directory into the container.
      # Clone repos to {WORKSPACE_HOST_PATH}/{owner}/{repo}.git on the host.
      # Must be an absolute path (no ~) — especially when running with sudo.
      - ${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH must be set in .env}:/var/lib/elyoraa/workspace
      # Bind-mount the host's trusted Crush configuration so the CLI is authenticated.
      # Must be an absolute path (no ~).
      - ${CRUSH_CONFIG_HOST_PATH:?CRUSH_CONFIG_HOST_PATH must be set in .env}:/home/elyoraa/.config/crush
      # Crush persists provider credentials and selected models in its data directory.
      - ${CRUSH_DATA_HOST_PATH:?CRUSH_DATA_HOST_PATH must be set in .env}:/home/elyoraa/.local/share/crush
      # Queue + job-record persistence (QUEUE_BACKEND=file). Queued jobs and
      # outcomes survive restarts/deploys.
      - queue-data:/var/lib/elyoraa/queue
    env_file: .env
    secrets:
      - github-app-private-key
    tmpfs:
      - /tmp/elyoraa

  # Optional Postgres for QUEUE_BACKEND=postgres (multi-replica / HA mode).
  # Enable with: docker compose --profile db up -d
  # and set DATABASE_URL=postgres://elyoraa:${POSTGRES_PASSWORD:-changeme}@db:5432/elyoraa
  # in .env. For production you probably want a managed Postgres instead.
  db:
    profiles: ["db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elyoraa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: elyoraa
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elyoraa -d elyoraa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  queue-data:
  pg-data:

secrets:
  github-app-private-key:
    file: ${GITHUB_APP_PRIVATE_KEY_SECRET:-./secrets/github-app-private-key.pem}
