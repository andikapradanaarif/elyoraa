services:
  elyoraa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: elyoraa
    ports:
      - "8080:8080"
    volumes:
      # Bind-mount the host repo directory into the container.
      # Clone repos to ~/app/elyoraa/repo/{owner}/{repo}.git on the host.
      - ${WORKSPACE_HOST_PATH:-~/app/elyoraa/repo}:/var/lib/elyoraa/workspace
      # Bind-mount the host's Devin credentials so the CLI is authenticated.
      - ${DEVIN_CREDS_HOST_PATH:-~/.config/devin}:/home/elyoraa/.config/devin
      - devin-config:/var/lib/elyoraa/devin-config
      # Bind the host's `devin` binary into the container.
      # Use the symlink path (e.g. /usr/local/bin/devin) rather than a
      # version-pinned path so the mount survives host upgrades.
      - ${DEVIN_BIN_HOST_PATH:-/usr/local/bin/devin}:/usr/local/bin/devin:ro
    env_file: .env
    secrets:
      - github-app-private-key
    tmpfs:
      - /tmp/elyoraa
    cap_add:
      - SYS_ADMIN # required for bubblewrap user namespaces
    security_opt:
      - "seccomp:unconfined"

volumes:
  devin-config:

secrets:
  github-app-private-key:
    file: ${GITHUB_APP_PRIVATE_KEY_SECRET:-./secrets/github-app-private-key.pem}
