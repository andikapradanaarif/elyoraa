services:
  elyoraa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: elyoraa
    ports:
      - "8080:8080"
    volumes:
      # Bind-mount the host repo directory into the container.
      # Clone repos to {WORKSPACE_HOST_PATH}/{owner}/{repo}.git on the host.
      # Must be an absolute path (no ~) — especially when running with sudo.
      - ${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH must be set in .env}:/var/lib/elyoraa/workspace
      # Bind-mount the host's Devin credentials so the CLI is authenticated.
      # Must be an absolute path (no ~).
      - ${DEVIN_CREDS_HOST_PATH:?DEVIN_CREDS_HOST_PATH must be set in .env}:/home/elyoraa/.config/devin
      # Devin stores auth tokens in ~/.local/share/devin/credentials.toml
      - ${DEVIN_DATA_HOST_PATH:?DEVIN_DATA_HOST_PATH must be set in .env}:/home/elyoraa/.local/share/devin
      - devin-config:/var/lib/elyoraa/devin-config
      # Bind the host's `devin` binary into the container.
      - ${DEVIN_BIN_HOST_PATH:-/usr/local/bin/devin}:/usr/local/bin/devin:ro
    env_file: .env
    secrets:
      - github-app-private-key
    tmpfs:
      - /tmp/elyoraa
    cap_add:
      - SYS_ADMIN # required for bubblewrap user namespaces
    security_opt:
      - "seccomp:unconfined"

volumes:
  devin-config:

secrets:
  github-app-private-key:
    file: ${GITHUB_APP_PRIVATE_KEY_SECRET:-./secrets/github-app-private-key.pem}
