name: Build and push elyoraa to GHCR

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "release"
      deploy_remote:
        description: "Deploy to the configured remote server"
        required: true
        default: "false"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: elyoraa

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/deploy/Dockerfile
          push: true
          platforms: linux/amd64
          # Tag the commit SHA (rollback = redeploy the previous SHA) and
          # keep :latest as the moving pointer.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Optional: deploy to a remote server. Requires REMOTE_HOST, REMOTE_USER and REMOTE_SSH_KEY secrets.
  deploy-remote:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.inputs.deploy_remote == 'true' }}

    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            cd /path/to/elyoraa/api/deploy
            # Deploy the pinned SHA image — rollback is the same script with
            # the previous tag. `pull` + `up -d` recreates the container only
            # when the image changed; `stop_grace_period` in the compose file
            # lets in-flight jobs drain before SIGKILL.
            export ELYORAA_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker compose pull
            docker compose up -d
