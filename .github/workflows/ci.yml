name: CI

on:
  pull_request:
  push:
    branches:
      - release

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Integration tests for the Postgres queue/dedup backend skip unless
      # TEST_DATABASE_URL is set; this service makes them run in CI.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elyoraa
          POSTGRES_PASSWORD: elyoraa
          POSTGRES_DB: elyoraa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elyoraa -d elyoraa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://elyoraa:elyoraa@localhost:5432/elyoraa_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so golangci-lint can diff against the base and only
          # flag issues introduced by the change — pre-existing lint debt
          # doesn't block PRs.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: api
          only-new-issues: true
          args: --timeout 5m

  vulncheck:
    runs-on: ubuntu-latest
    # Advisory for now: existing dependency findings shouldn't block merges.
    # Flip to required once the backlog is triaged.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          work-dir: api
